[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-exporter"
version = "1.0.0"
description = "A CLI wrapper for DiscordChatExporter.Cli - Export Discord chat logs easily"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Discord Exporter"}
]
keywords = ["discord", "chat", "export", "cli", "backup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]

# No external dependencies - using only standard library
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
discord-exporter = "discord_exporter.cli:main"

[project.gui-scripts]
discord-exporter-gui = "discord_exporter.gui:main"

[project.urls]
Homepage = "https://github.com/your-username/discord-exporter"
Repository = "https://github.com/your-username/discord-exporter"

[tool.setuptools.packages.find]
where = ["."]
include = ["discord_exporter*"]
